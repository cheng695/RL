<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UZ-05 Training Observatory</title>
  <style>
    :root { --bg:#111415; --panel:#191d1e; --panel2:#202526; --line:#303839; --text:#e8eeec; --muted:#93a09d; --mint:#9de3ca; --yellow:#f2c879; --red:#f18a86; --blue:#8cbcf2; }
    * { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 Inter,ui-sans-serif,system-ui,sans-serif; }
    .shell { max-width:1500px; margin:0 auto; padding:28px 28px 52px; }
    header { display:flex; justify-content:space-between; gap:20px; align-items:flex-end; border-bottom:1px solid var(--line); padding-bottom:22px; }
    .eyebrow { color:var(--mint); font-size:11px; letter-spacing:.14em; text-transform:uppercase; font-weight:700; }
    h1 { margin:6px 0 5px; font-size:30px; letter-spacing:-.02em; } .sub { color:var(--muted); }
    select { background:var(--panel2); color:var(--text); border:1px solid var(--line); padding:10px 34px 10px 12px; border-radius:6px; min-width:300px; }
    .toolbar { display:flex; justify-content:space-between; align-items:center; gap:15px; margin:24px 0 18px; flex-wrap:wrap; }
    .run-meta { color:var(--muted); } .status { color:var(--mint); }
    .metrics { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px; margin-bottom:14px; }
    .metric, .panel { background:var(--panel); border:1px solid var(--line); border-radius:7px; }
    .metric { padding:15px 16px; min-height:88px; } .metric label { display:block; color:var(--muted); font-size:12px; margin-bottom:8px; } .metric strong { font-size:23px; font-weight:650; }
    .grid { display:grid; grid-template-columns:1.4fr 1fr; gap:14px; } .panel { padding:16px; min-width:0; }
    .panel.wide { grid-column:1/-1; } .panel-head { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-bottom:10px; } h2 { margin:0; font-size:15px; } .hint { color:var(--muted); font-size:12px; }
    .chart { width:100%; height:270px; display:block; } .legend { display:flex; flex-wrap:wrap; gap:7px 14px; margin-top:8px; color:var(--muted); font-size:11px; } .legend span::before { content:""; display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--c); margin-right:6px; }
    .tag-list { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:8px; max-height:305px; overflow:auto; padding-right:4px; } .tag-btn { text-align:left; border:1px solid var(--line); color:var(--text); background:var(--panel2); padding:10px; border-radius:5px; cursor:pointer; } .tag-btn.active { border-color:var(--mint); background:#21312e; } .tag-btn small { display:block; color:var(--muted); margin-top:3px; }
    .table-wrap { max-height:290px; overflow:auto; } table { width:100%; border-collapse:collapse; font-size:12px; } th,td { padding:9px 8px; border-bottom:1px solid var(--line); text-align:left; } th { color:var(--muted); font-weight:500; position:sticky; top:0; background:var(--panel); } td:not(:first-child) { text-align:right; font-variant-numeric:tabular-nums; }
    pre { margin:0; max-height:270px; overflow:auto; color:#b8c5c0; font:11px/1.5 ui-monospace,SFMono-Regular,monospace; white-space:pre-wrap; }
    .empty { color:var(--muted); padding:36px 0; text-align:center; } .error { color:var(--red); }
    @media (max-width:900px) { .shell{padding:20px 14px 36px;} header{display:block;} select{margin-top:15px;width:100%;min-width:0;} .metrics{grid-template-columns:repeat(2,1fr);} .grid{grid-template-columns:1fr;} .panel.wide{grid-column:auto;} }
    @media (max-width:520px) { h1{font-size:24px;} .metrics{grid-template-columns:1fr 1fr;} .metric strong{font-size:19px;} }
  </style>
</head>
<body>
<main class="shell">
  <header><div><div class="eyebrow">RL / UZ-05 / TRAINING OBSERVATORY</div><h1>训练成果可视化</h1><div class="sub">把 reward、稳定性、速度跟踪和训练健康度放在同一张工作台上。</div></div><div><label class="eyebrow" for="runSelect">RUN</label><br><select id="runSelect"></select></div></header>
  <div class="toolbar"><div id="runMeta" class="run-meta">正在读取训练日志…</div><div id="status" class="status"></div></div>
  <section class="metrics" id="metrics"></section>
  <section class="grid">
    <article class="panel wide"><div class="panel-head"><h2>训练总回报</h2><span class="hint">按训练 iteration</span></div><canvas class="chart" id="rewardChart"></canvas></article>
    <article class="panel"><div class="panel-head"><h2>任务表现</h2><span class="hint">误差越低越好</span></div><canvas class="chart" id="trackingChart"></canvas></article>
    <article class="panel"><div class="panel-head"><h2>终止原因</h2><span class="hint">episode fraction</span></div><canvas class="chart" id="terminationChart"></canvas></article>
    <article class="panel wide"><div class="panel-head"><h2>奖励项浏览</h2><span class="hint">点击指标切换曲线</span></div><div class="tag-list" id="rewardTags"></div><canvas class="chart" id="rewardTermsChart"></canvas><div class="legend" id="rewardLegend"></div></article>
    <article class="panel"><div class="panel-head"><h2>关键指标摘要</h2><span class="hint">首值 / 当前 / 最优</span></div><div class="table-wrap"><table><thead><tr><th>指标</th><th>首值</th><th>当前</th><th>最小</th><th>最大</th></tr></thead><tbody id="summaryTable"></tbody></table></div></article>
    <article class="panel"><div class="panel-head"><h2>实验配置</h2><span class="hint">原始 YAML</span></div><pre id="config"></pre></article>
  </section>
</main>
<script>
const palette=['#9de3ca','#8cbcf2','#f2c879','#f18a86','#c7a6f7','#e9a4c9','#9bd1cf','#c5d68d'];
const state={run:null, selected:[]};
const $=id=>document.getElementById(id);
const fmt=(v,n=3)=>Number.isFinite(v)?Number(v).toFixed(n):'—';
function tag(data, names){ return names.find(n=>data.scalars[n]); }
function draw(canvas, series, labels, colors=palette){
  const rect=canvas.getBoundingClientRect(), dpr=devicePixelRatio||1, w=Math.max(300,rect.width), h=rect.height||270; canvas.width=w*dpr; canvas.height=h*dpr; const c=canvas.getContext('2d'); c.scale(dpr,dpr); c.clearRect(0,0,w,h);
  const all=series.flatMap(s=>s.data.map(p=>p.value)).filter(Number.isFinite); if(!all.length){c.fillStyle='#93a09d'; c.fillText('暂无数据',18,30);return;}
  let lo=Math.min(...all), hi=Math.max(...all); if(lo===hi){lo-=1;hi+=1;} const pad={l:44,r:12,t:12,b:26}; const x=i=>pad.l+i/(Math.max(1,(series[0]?.data.length||2)-1))*(w-pad.l-pad.r); const y=v=>pad.t+(hi-v)/(hi-lo)*(h-pad.t-pad.b);
  c.strokeStyle='#303839'; c.lineWidth=1; c.font='11px ui-sans-serif'; c.fillStyle='#93a09d'; for(let i=0;i<4;i++){const yy=pad.t+i/3*(h-pad.t-pad.b);c.beginPath();c.moveTo(pad.l,yy);c.lineTo(w-pad.r,yy);c.stroke();c.fillText(fmt(hi-(hi-lo)*i/3,2),4,yy+4);}
  series.forEach((s,si)=>{c.strokeStyle=colors[si%colors.length]; c.lineWidth=2; c.beginPath(); s.data.forEach((p,i)=>{const xx=pad.l+i/(Math.max(1,s.data.length-1))*(w-pad.l-pad.r), yy=y(p.value); i?c.lineTo(xx,yy):c.moveTo(xx,yy);}); c.stroke();});
  c.fillStyle='#93a09d'; c.fillText('step 0',pad.l,h-7); const last=series[0]?.data.at(-1)?.step; if(last!=null)c.fillText('step '+last,w-65,h-7);
}
function setLegend(id, labels){$(id).innerHTML=labels.map((x,i)=>`<span style="--c:${palette[i%palette.length]}">${x}</span>`).join('');}
function render(){const d=state.run, s=d.scalars, sum=d.summary; if(!d)return;
  const reward=tag(d,['Train/mean_reward','Train/mean_reward/time']), len=tag(d,['Train/mean_episode_length','Train/mean_episode_length/time']), vel=tag(d,['Metrics/base_velocity/error_vel_xy','Metrics/base_velocity/error_vel_x']), yaw=tag(d,['Metrics/base_velocity/error_vel_yaw']), height=tag(d,['Metrics/base_height/error_height','Episode_Reward/base_height']), timeout=tag(d,['Episode_Termination/time_out']), contact=tag(d,['Episode_Termination/base_contact']);
  $('runMeta').textContent=`${d.experiment}  ·  ${d.name}  ·  ${d.event_files.length} event file  ·  checkpoint ${d.checkpoint||'未找到'}`; $('status').textContent=`${d.scalar_tags.length} 个标量`;
  const cards=[['当前回报',reward&&sum[reward]?.last,'mint'],['当前回合长度',len&&sum[len]?.last,'blue'],['速度误差',vel&&sum[vel]?.last,'yellow'],['高度误差',height&&sum[height]?.last,'mint'],['超时比例',timeout&&sum[timeout]?.last,'red']]; $('metrics').innerHTML=cards.map(x=>`<div class="metric"><label>${x[0]}</label><strong style="color:var(--${x[2]})">${fmt(x[1])}</strong></div>`).join('');
  const rewards=d.scalar_tags.filter(k=>k.startsWith('Episode_Reward/')); if(!state.selected.length)state.selected=rewards.slice(0,Math.min(4,rewards.length));
  draw($('rewardChart'), reward?[{data:s[reward]}]:[],[]); draw($('trackingChart'),[vel,yaw,height].filter(Boolean).map(k=>({data:s[k]})),[]); setLegend('rewardLegend',state.selected);
  const terms=[timeout,contact,'Episode_Termination/bad_roll_pitch','Episode_Termination/leg_tendon_length'].filter(Boolean); draw($('terminationChart'),terms.map(k=>({data:s[k]})),[]);
  draw($('rewardTermsChart'),state.selected.map(k=>({data:s[k]})),[]);
  const rows=[reward,len,vel,yaw,height,timeout,contact].filter(Boolean); $('summaryTable').innerHTML=rows.map(k=>`<tr><td>${k}</td><td>${fmt(sum[k].first)}</td><td>${fmt(sum[k].last)}</td><td>${fmt(sum[k].minimum)}</td><td>${fmt(sum[k].maximum)}</td></tr>`).join('');
  $('config').textContent=Object.entries(d.params||{}).map(([k,v])=>`# ${k}\n${v}`).join('\n');
  $('rewardTags').innerHTML=rewards.map((k,i)=>`<button class="tag-btn ${state.selected.includes(k)?'active':''}" data-tag="${k}">${k.replace('Episode_Reward/','')}<small>last ${fmt(sum[k]?.last)}</small></button>`).join(''); document.querySelectorAll('.tag-btn').forEach(b=>b.onclick=()=>{const k=b.dataset.tag; state.selected=state.selected.includes(k)?state.selected.filter(x=>x!==k):[...state.selected,k];render();});
}
async function loadRun(id){$('status').textContent='读取中…'; const r=await fetch('/api/run?id='+encodeURIComponent(id)); if(!r.ok)throw Error(await r.text()); state.run=await r.json();state.selected=[];render();}
async function boot(){try{const r=await fetch('/api/runs');const data=await r.json();const select=$('runSelect');select.innerHTML=data.runs.map(x=>`<option value="${x.id}">${x.experiment} / ${x.name}</option>`).join(''); if(!data.runs.length){$('runMeta').textContent='没有找到 TensorBoard event 文件';return;} select.onchange=()=>loadRun(select.value); await loadRun(data.runs[0].id);}catch(e){$('runMeta').innerHTML='<span class="error">读取失败：'+e.message+'</span>';}}
window.addEventListener('resize',()=>state.run&&render()); boot();
</script>
</body></html>
