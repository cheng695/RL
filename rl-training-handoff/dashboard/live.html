<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>UZ-05 Live Agent Preview</title>
  <style>
    :root{--bg:#0e1112;--panel:#171c1d;--panel2:#202728;--line:#303a3b;--text:#e8eeec;--muted:#91a09d;--mint:#9de3ca;--blue:#8cbcf2;--yellow:#f2c879;--red:#f18a86}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 Inter,system-ui,sans-serif}.layout{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) 340px}.stage{position:relative;min-height:100vh;background:#111718;overflow:hidden;cursor:grab;touch-action:none}.stage:active{cursor:grabbing}#scene,#viewportFrame{width:100%;height:100vh;display:block}.fallback-hidden{display:none!important}#viewportFrame{position:absolute;inset:0;object-fit:contain;background:#111718;image-rendering:auto;user-select:none;-webkit-user-drag:none}.brand{position:absolute;left:28px;top:24px;text-shadow:0 1px 8px rgba(0,0,0,.45);pointer-events:none}.framehud{position:absolute;left:24px;bottom:22px;color:rgba(232,238,236,.75);font:12px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;text-shadow:0 1px 6px rgba(0,0,0,.55);pointer-events:none}.eyebrow{font-size:11px;letter-spacing:.15em;font-weight:700;color:var(--mint)}h1{font-size:28px;margin:6px 0}.sub{color:var(--muted)}.live{color:var(--mint);font-size:12px;margin-top:12px}.side{padding:24px 20px;background:var(--panel);border-left:1px solid var(--line);overflow:auto}.section{border-bottom:1px solid var(--line);padding:0 0 20px;margin-bottom:20px}.section:last-child{border:0}.section h2{font-size:14px;margin:0 0 14px}.control{margin:14px 0}.labelrow{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:7px}.value{color:var(--text);font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:var(--mint)}button{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:9px 12px;border-radius:5px;cursor:pointer}button:hover{border-color:var(--mint)}.buttons{display:flex;gap:8px;flex-wrap:wrap}.telemetry{display:grid;grid-template-columns:1fr 1fr;gap:8px}.readout{background:var(--panel2);padding:11px;border-radius:5px;border:1px solid var(--line)}.readout label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}.readout strong{font-size:18px;font-weight:600}.note{font-size:12px;color:var(--muted);line-height:1.55}.pill{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:4px 8px;color:var(--muted);font-size:11px}@media(max-width:850px){.layout{display:block}.stage{height:58vh;min-height:380px}.side{border-left:0;border-top:1px solid var(--line)}#scene,#viewportFrame{height:58vh}}
  </style>
</head>
<body><div class="layout"><main class="stage"><canvas id="scene"></canvas><img id="viewportFrame" class="fallback-hidden" alt=""><div class="brand"><div class="eyebrow">UZ-05 / LIVE POLICY PREVIEW</div><h1>在线 Agent 试驾</h1><div class="sub">Isaac Lab 推理 · 本地实时状态</div><div class="live" id="connection">● 等待 Isaac Lab</div></div><div class="framehud" id="frameHud">viewport frame 等待中</div></main>
<aside class="side"><section class="section"><h2>实验控制</h2><div class="control"><div class="labelrow"><span>前向速度 vx</span><span class="value" id="vxText">0.00 m/s</span></div><input id="vx" type="range" min="-1" max="1" step="0.01" value="0"></div><div class="control"><div class="labelrow"><span>偏航速度 yaw</span><span class="value" id="yawText">0.00 rad/s</span></div><input id="yaw" type="range" min="-2" max="2" step="0.01" value="0"></div><div class="control"><div class="labelrow"><span>目标高度</span><span class="value" id="heightText">0.30 m</span></div><input id="height" type="range" min="0.25" max="0.4" step="0.001" value="0.30"></div><div class="buttons"><button data-vx="0" data-yaw="0">站立</button><button data-vx="0.5" data-yaw="0">直行 0.5</button><button data-vx="1" data-yaw="0">直行 1.0</button><button data-vx="0" data-yaw="0.8">右转</button></div><div class="buttons" style="margin-top:10px"><button id="pause">暂停</button><button id="reset">复位</button><button id="follow">跟随镜头：开</button></div><label class="note" style="display:block;margin-top:12px"><input id="baseline" type="checkbox" checked> 使用训练好的 policy</label></section>
<section class="section"><h2>实时状态</h2><div class="telemetry"><div class="readout"><label>实际 vx</label><strong id="actualVx">—</strong></div><div class="readout"><label>实际 vy</label><strong id="actualVy">—</strong></div><div class="readout"><label>实际 yaw</label><strong id="actualYaw">—</strong></div><div class="readout"><label>base 高度</label><strong id="actualHeight">—</strong></div><div class="readout"><label>姿态倾角</label><strong id="tilt">—</strong></div><div class="readout"><label>模拟步数</label><strong id="step">—</strong></div></div></section>
<section class="section"><h2>当前推理</h2><div class="pill" id="commandPill">等待命令</div><p class="note">左侧场景会随 Isaac Lab 的根部位置、速度、姿态和关节状态更新。拖动命令滑块后，目标会写入正在运行的 policy environment。</p></section><section class="section"><h2>诊断</h2><pre id="diagnostic" class="note">等待状态…</pre></section></aside></div>
<script>
const canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d'),frameImg=document.querySelector('#viewportFrame');let state={position:[0,0,.3],linear_velocity:[0,0,0],angular_velocity:[0,0,0],tilt:0,height:.3,step:0,command:{vx:0,yaw:0,height:.3}},lastFrameIndex=-1,frameVisible=false;
const $=id=>document.getElementById(id),fmt=(v,n=2)=>Number.isFinite(v)?Number(v).toFixed(n):'—';
function resize(){const r=canvas.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);draw()}window.addEventListener('resize',resize);
function project(x,y,z){const w=canvas.clientWidth,h=canvas.clientHeight;return [w*.53+(x-y)*120,h*.72+(x+y)*45-z*150]}
function line(a,b,color,width=2){ctx.beginPath();ctx.moveTo(...project(...a));ctx.lineTo(...project(...b));ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()}
function draw(){const w=canvas.clientWidth,h=canvas.clientHeight;ctx.clearRect(0,0,w,h);const grd=ctx.createLinearGradient(0,0,0,h);grd.addColorStop(0,'#1e2b2d');grd.addColorStop(1,'#111819');ctx.fillStyle=grd;ctx.fillRect(0,0,w,h);for(let i=-8;i<=8;i++){line([-4,i,0],[4,i,0],'#304344',1);line([i,-4,0],[i,4,0],'#304344',1)}const p=state.position||[0,0,.3];const z=Number(state.height)||.3;const shadow=project(p[0],p[1],.015);ctx.beginPath();ctx.ellipse(shadow[0],shadow[1],100,20,0,0,Math.PI*2);ctx.fillStyle='rgba(0,0,0,.32)';ctx.fill();const bx=p[0],by=p[1];line([bx-.38,by-.28,z],[bx+.38,by-.28,z],'#9de3ca',6);line([bx-.38,by+.28,z],[bx+.38,by+.28,z],'#9de3ca',6);line([bx-.38,by-.28,z],[bx-.38,by+.28,z],'#9de3ca',6);line([bx+.38,by-.28,z],[bx+.38,by+.28,z],'#9de3ca',6);for(const side of [-1,1]){const wheel=[bx,by+side*.36,.2];const wp=project(...wheel);ctx.beginPath();ctx.arc(wp[0],wp[1],27,0,Math.PI*2);ctx.fillStyle='#222a2c';ctx.fill();ctx.strokeStyle='#8cbcf2';ctx.lineWidth=5;ctx.stroke();line([bx-.25,by+side*.22,z-.05],[bx+.25,by+side*.22,.35],'#f2c879',5);line([bx+.25,by+side*.22,.35],wheel,'#f2c879',5)}ctx.fillStyle='#93a09d';ctx.font='12px system-ui';ctx.fillText('ground / dome light preview',24,h-24);ctx.fillText(`vx ${fmt(state.linear_velocity?.[0])} m/s`,24,h-44)}
function syncInputs(){const c=state.command||{};for(const [id,key] of [['vx','vx'],['yaw','yaw'],['height','height']])$(id).value=c[key]??$(id).value;$('vxText').textContent=fmt($('vx').value)+' m/s';$('yawText').textContent=fmt($('yaw').value)+' rad/s';$('heightText').textContent=fmt($('height').value,3)+' m'}
function send(){const payload={command_vx:+$('vx').value,command_yaw:+$('yaw').value,command_height:+$('height').value};fetch('/api/live-command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).catch(()=>{});syncInputs()}
['vx','yaw','height'].forEach(id=>$(id).addEventListener('input',send));document.querySelectorAll('button[data-vx]').forEach(b=>b.onclick=()=>{$('vx').value=b.dataset.vx;$('yaw').value=b.dataset.yaw;send()});
async function control(action){await fetch('/api/live-control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action})});}$('pause').onclick=()=>control('pause');$('reset').onclick=()=>control('reset');let follow=true;
async function sendCamera(payload){payload.follow=follow;await fetch('/api/live-camera',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).catch(()=>{})}
$('follow').onclick=()=>{follow=!follow;$('follow').textContent='跟随镜头：'+(follow?'开':'关');sendCamera({follow})};
let dragging=false,lastX=0,lastY=0,cameraDx=0,cameraDy=0,cameraQueued=false;function queueCameraDrag(dx,dy){cameraDx+=dx;cameraDy+=dy;if(cameraQueued)return;cameraQueued=true;requestAnimationFrame(()=>{cameraQueued=false;const dx=cameraDx,dy=cameraDy;cameraDx=0;cameraDy=0;sendCamera({yaw_delta:-dx*0.006,pitch_delta:dy*0.004})})}
document.querySelector('.stage').addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;e.currentTarget.setPointerCapture(e.pointerId)});
document.querySelector('.stage').addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;queueCameraDrag(dx,dy)});
document.querySelector('.stage').addEventListener('pointerup',()=>{dragging=false});
document.querySelector('.stage').addEventListener('pointercancel',()=>{dragging=false});
document.querySelector('.stage').addEventListener('wheel',e=>{e.preventDefault();sendCamera({distance_delta:e.deltaY*0.004})},{passive:false});
async function refreshFrame(){if(!state.running)return;const idx=state.frame_index??0;if(idx<=lastFrameIndex)return;lastFrameIndex=idx;frameImg.src=`/api/frame?t=${Date.now()}`;$('frameHud').textContent=`Isaac viewport frame ${idx}${state.frame_size?' · '+state.frame_size.join('x'):''}`}
frameImg.onload=()=>{frameVisible=true;frameImg.classList.remove('fallback-hidden');canvas.classList.add('fallback-hidden')};
frameImg.onerror=()=>{frameVisible=false;frameImg.classList.add('fallback-hidden');canvas.classList.remove('fallback-hidden');$('frameHud').textContent='viewport frame 不可用，使用简化预览'};
async function poll(){try{const r=await fetch('/api/live-state',{cache:'no-store'});state=await r.json();if(state.camera?.follow!==undefined&&state.camera.follow!==follow){follow=state.camera.follow;$('follow').textContent='跟随镜头：'+(follow?'开':'关')}$('connection').textContent=state.running?(state.paused?'● 已暂停':'● Isaac Lab 正在运行'):'● 等待 Isaac Lab';$('connection').style.color=state.running?(state.paused?'var(--yellow)':'var(--mint)'):'var(--yellow)';$('pause').textContent=state.paused?'继续':'暂停';$('actualVx').textContent=fmt(state.linear_velocity?.[0])+' m/s';$('actualVy').textContent=fmt(state.linear_velocity?.[1])+' m/s';$('actualYaw').textContent=fmt(state.angular_velocity?.[2])+' rad/s';$('actualHeight').textContent=fmt(state.height,3)+' m';$('tilt').textContent=fmt((state.tilt||0)*180/Math.PI)+'°';$('step').textContent=state.step??'—';$('commandPill').textContent=`目标 vx ${fmt(state.command?.vx)} · yaw ${fmt(state.command?.yaw)} · 高度 ${fmt(state.command?.height,3)}`;$('diagnostic').textContent=`roll/pitch tilt  ${fmt((state.tilt||0)*180/Math.PI)} deg\nbase height      ${fmt(state.height,3)} m\ncommand vx       ${fmt(state.command?.vx)} m/s\nmeasured vx/error ${fmt(state.linear_velocity?.[0])} / ${fmt((state.linear_velocity?.[0]||0)-(state.command?.vx||0))} m/s\ncamera           ${state.camera?.follow?'follow':'free'} d=${fmt(state.camera?.distance,1)}\nviewport frame   ${state.frame_index??0}\nstep             ${state.step??'—'}\nstatus           ${state.paused?'paused':'running'}`;syncInputs();if(!frameVisible)draw();refreshFrame()}catch(e){$('connection').textContent='● 未连接 Isaac Lab';$('connection').style.color='var(--red)'}}resize();poll();setInterval(poll,100);
</script></body></html>
